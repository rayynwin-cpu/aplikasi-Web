<!DOCTYPE html>
<html>
    <head>
        <title>Penerbangan</title>
    </head>
    <body>
        <form method="post" action="program">
        <p><h2>Penelusuran penerbangan</h2>
        <p><b>Nama Anda:</b><input type="text" maxlength="40" size="25"></p>
        <p><b>Nama belakang Anda:</b><input type="text" maxlength="30" size="23"></p>

        <p><b>Your gender:</b>
        <input type="radio" name="gender" value="Male">Male 
        <input type="radio" name="gender" value="Female">Female

        </p>

        <p><b>Pilih kota:</b>
            <select name="cities">
            <option value="New York">New York</option>
            <option value="Los Angeles">Los Angeles</option>
            <option value="London">London</option>
            <option value="Beijing">Beijing</option>
            <option value="Tokyo">Tokyo</option>
            <option value="Seoul">Seoul</option>
        </select> </p>
        
        <p><b>Select a date:</b>

        <input type="date" name="calender"></p>
        <p><b>Pilih waktu yang diinginkan</b>
        <input type="time" name="time" value="00:00"></p>
        <p><input type="submit" value="Search"> </p>
    </body>
</html>
