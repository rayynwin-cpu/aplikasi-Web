<!DOCTYPE html>
<html>
    <head>
        <title>Questionnaire</title>
    </head>
    <body>
        <form method="post" action="program">
            <p><h2>Isi kuesioner:</h2>
        
            <p><b>Nama Anda:</b><input type="text" maxlength="40" size="25"></p>

            <p><b>Nama belakang Anda:</b><input type="text" maxlength="30" size="23"></p>

            <p><b>Usia Anda:</b>
            <input type="Number" name="Age" value="10" min="10" max="18" step="1"></p>  
 
            <p><b>Pilih kursus yang Anda minati:</b>
            <p><input type="checkbox" name="course" > Scratch</p>
            <p><input type="checkbox" name="course" > Gamedesign</p>
            <p><input type="checkbox" name="course" > Python Start</p>
            <p><input type="checkbox" name="course" > Python Pro</p>

            <p><b>Komentar tambahan:</b>
            <textarea name="comment"></textarea></p>
            <p><input type="submit" value="send"></p>
        </form>
    </body>
</html>
